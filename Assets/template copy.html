<!DOCTYPE html>
<html lang="und">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16:9 · PowerPoint style template</title>
    <style>
         /* ============================================================
        LAYOUT RULES:
        - Container .frame-16-9 has fixed 16:9 aspect ratio.
        - All internal dimensions in % (0–100).
        - For every element: left + width <= 100, top + height <= 100.
        - All font sizes are relative (rem, em, %, vw, etc.).
        - MINIMUM FONT SIZE: all text must be at least 1.3em (relative to the base font size defined in :root).
        - Modify only the :root variables to change appearance.
        ============================================================ */
         * {
             margin: 0;
             padding: 0;
             box-sizing: border-box
         }

         html {
             font-size: 1.2vw
         }

         body {
             display: flex;
             justify-content: center;
             align-items: center;
             min-height: 100vh;
             background: var(--color-bg,#1a1a2e);
             padding: 0;
             margin: 0;
             transition: background .3s
         }

         :root {
             --space-xs: .3rem;
             --space-sm: .8rem;
             --space-md: 1.4rem;
             --space-lg: 2.2rem;
             --font-base: 1rem;
             --font-min: 1.3rem;
             --color-bg: #f4f6fa;
             --color-slide-bg: #fff;
             --color-text: #1a1a2e;
             --color-accent: #4a6cf7;
             --color-controls-bg: rgba(0,0,0,.3);
             --color-controls-text: #fff
         }

         body.dark {
             --color-bg: #1a1a2e;
             --color-slide-bg: #2a2a3e;
             --color-text: #f4f6fa;
             --color-accent: #6d8dff;
             --color-controls-bg: rgba(255,255,255,.25)
         }

         .frame-16-9 {
             width: 95%;
             max-width: 95vw;
             aspect-ratio: 16/9;
             background: var(--color-slide-bg);
             position: relative;
             overflow: hidden;
             border-radius: 1.8rem;
             box-shadow: 0 2rem 4rem rgba(0,0,0,.6);
             transition: background .3s
         }

             .frame-16-9 > * {
                 position: absolute;
                 box-sizing: border-box
             }

         .slide {
             top: 0;
             left: 0;
             width: 100%;
             height: 100%;
             background: var(--color-slide-bg);
             opacity: 0;
             visibility: hidden;
             transform: scale(1.08) translateY(15px);
             filter: blur(8px);
             z-index: 1;
             transition: opacity .7s cubic-bezier(.25,.46,.45,.94),transform .7s cubic-bezier(.25,.46,.45,.94),filter .7s cubic-bezier(.25,.46,.45,.94),visibility 0s linear .7s
         }

             .slide.active {
                 opacity: 1;
                 visibility: visible;
                 transform: scale(1) translateY(0);
                 filter: blur(0);
                 z-index: 2;
                 transition: opacity .7s cubic-bezier(.25,.46,.45,.94),transform .7s cubic-bezier(.25,.46,.45,.94),filter .7s cubic-bezier(.25,.46,.45,.94),visibility 0s linear 0s
             }

         /* navigation buttons - outside the container */
         .nav-btn {
             position: fixed;
             top: 50%;
             transform: translateY(-50%);
             width: 3rem;
             height: 3rem;
             border: none;
             border-radius: 50%;
             background: var(--color-controls-bg);
             color: var(--color-controls-text);
             font-size: var(--font-min);
             cursor: pointer;
             display: flex;
             align-items: center;
             justify-content: center;
             z-index: 100;
             transition: background .2s,transform .1s
         }

             .nav-btn:hover {
                 background: var(--color-accent)
             }

             .nav-btn:active {
                 transform: translateY(-50%) scale(.95)
             }

         #prev-slide {
             left: 1rem
         }

         #next-slide {
             right: 1rem
         }

         /* counter - outside the container */
         .counter {
             position: fixed;
             bottom: 1rem;
             left: 50%;
             transform: translateX(-50%);
             background: var(--color-controls-bg);
             color: var(--color-controls-text);
             padding: .4rem .8rem;
             border-radius: 1rem;
             font-size: var(--font-min);
             z-index: 100;
             pointer-events: none
         }

         /* theme toggle: 90% transparent, becomes opaque on hover */
         .theme-toggle {
             position: fixed;
             top: 1.5rem;
             right: 1.5rem;
             background: var(--color-slide-bg);
             color: var(--color-text);
             border: 1px solid var(--color-accent);
             border-radius: 2rem;
             padding: .5rem 1rem;
             font-size: var(--font-min);
             cursor: pointer;
             z-index: 100;
             box-shadow: 0 .5rem 1rem rgba(0,0,0,.1);
             opacity: .1;
             transition: opacity .3s
         }

             .theme-toggle:hover {
                 opacity: 1
             }
    </style>
</head>
<body>

    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">Dark</button>

    <div class="frame-16-9" id="presentation-frame">
        <!--
          HOW TO ADD SLIDES:
          Simply copy and paste an existing <div class="slide"></div> line below.
          No JavaScript changes are required; the script automatically counts
          and navigates all elements with the class "slide".
          You can add as many slides as you need, in any order.

          HOW TO REMOVE SLIDES:
          Delete the corresponding <div class="slide"></div> line.
          Remember to keep at least one slide with the class "active"
          (the first one) so the presentation starts correctly.

          Each slide is empty by default – add your content inside them.

          HOW TO ADD CONTENT THAT ADAPTS TO THEME:
          Inside each slide, use CSS variables defined in :root for colors:
          - color: var(--color-text);        /* text color follows theme */
          - background-color: var(--color-slide-bg); /* slide background */
          - border-color: var(--color-accent);      /* accents, borders, etc. */
          Example:
          <div class="slide active">
            <h2 style="color: var(--color-text);">Title</h2>
            <p style="color: var(--color-text);">Content</p>
          </div>
          The variables update automatically when the theme changes.
        -->
        <div class="slide active"></div>
        <div class="slide"></div>
        <div class="slide"></div>
    </div>

    <button id="prev-slide" class="nav-btn" aria-label="Previous slide">‹</button>
    <button id="next-slide" class="nav-btn" aria-label="Next slide">›</button>
    <div class="counter" id="slide-counter">1 / 3</div>

    <script>
        (function () {
            'use strict';
            // slide nav
            const slides = Array.from(document.querySelectorAll('.slide')), counter = document.getElementById('slide-counter'), prevBtn = document.getElementById('prev-slide'), nextBtn = document.getElementById('next-slide');
            let cur = 0;
            const upd = () => { if (slides.length) { slides.forEach((s, i) => s.classList.toggle('active', i === cur)); counter.textContent = (cur + 1) + ' / ' + slides.length } };
            const go = i => { if (slides.length) { cur = (i + slides.length) % slides.length; upd() } };
            nextBtn.onclick = () => go(cur + 1);
            prevBtn.onclick = () => go(cur - 1);
            document.addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(cur + 1) } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1) } });
            upd();

            // theme toggle with localStorage
            const tog = document.getElementById('theme-toggle');
            const apply = (t) => { document.body.classList.toggle('dark', t === 'dark'); tog.textContent = t === 'dark' ? 'Light' : 'Dark'; localStorage.setItem('theme', t) };
            apply(localStorage.getItem('theme') || 'light');
            tog.onclick = () => { apply(document.body.classList.contains('dark') ? 'light' : 'dark'); tog.blur() };
        })();
    </script>
</body>
</html>
